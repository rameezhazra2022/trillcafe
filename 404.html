<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
(function(){
  var p = location.pathname;
  if (p === '/' || p === '/index.html') return;
  fetch('/restaurant.html', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('restaurant.html unavailable'); return r.text(); })
    .then(function(t){
      document.open();
      document.write(t);
      document.close();
    })
    .catch(function(){
      location.replace('/');
    });
})();
</script>
</head>
<body></body>
</html>
