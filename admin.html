<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATE³ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
:root{--o:#ff6b00;--bg:#0a0807;--panel:#17110e;--cream:#fffaf3;--line:#40352e;--muted:#aaa19a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:linear-gradient(145deg,#090807,#24150d);color:#222}
button,input{font:inherit}.top{height:74px;background:#080808;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid #302b27;position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:24px}.brand sup{color:var(--o);font-size:12px}.admin{font-size:11px;color:#999;margin-left:8px}
.wrap{width:min(1400px,94vw);margin:auto;padding:30px 0 60px}.login{min-height:calc(100vh - 74px);display:grid;place-items:center;padding:25px}.card{background:var(--cream);border:1px solid #d8c9b9;border-radius:18px;box-shadow:0 25px 70px #0008}.login .card{width:min(420px,95vw);padding:30px}
.kicker{font-size:10px;letter-spacing:2px;color:var(--o);font-weight:900}.login h1,.head h1{margin:7px 0;font-size:30px}.login p,.head p{font-size:12px;color:#667085;line-height:1.5}
label{display:block;font-size:10px;font-weight:800;margin:13px 0 6px}input[type=email],input[type=password],input[type=text]{width:100%;height:43px;border:1px solid #cfc3b6;border-radius:8px;padding:0 11px;background:#fff;outline:0}input:focus{border-color:var(--o)}
.primary,.publish{border:0;background:var(--o);color:#111;font-weight:900;border-radius:9px;padding:12px 16px;cursor:pointer}.primary{width:100%;margin-top:18px}.error{margin-top:12px;background:#fff0ed;border:1px solid #e3a99c;color:#a22d1c;padding:10px;border-radius:8px;font-size:10px}
.head{display:flex;justify-content:space-between;align-items:end;color:#fff;margin-bottom:22px}.head h1{color:#fff}.head p{color:#bdb4ad}.refresh,.signout{background:#15110f;border:1px solid #51463d;color:#fff;border-radius:8px;padding:10px 13px;font-size:10px;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;color:#fff}.stat b{font-size:24px;display:block}.stat span{font-size:9px;color:var(--muted)}
.restaurant{background:var(--cream);border:1px solid #d6c6b5;border-radius:14px;overflow:hidden;margin-bottom:13px}.rmain{padding:17px 19px;display:flex;justify-content:space-between;gap:15px;align-items:center}.rmain h2{margin:0 0 5px;font-size:17px}.meta{font-size:9px;color:#70746f;line-height:1.6}.status{font-size:8px;font-weight:900;padding:6px 9px;border-radius:999px;background:#fff0dc;color:#a64a00}.status.pub{background:#e6f8ee;color:#197348}.manage{border:1px solid #c7b8a9;background:#fff;border-radius:8px;padding:8px 11px;font-size:9px;font-weight:800;cursor:pointer}
.details{border-top:1px solid #ded2c5;padding:18px;background:#fffdf9}.details h3{font-size:14px;margin:0 0 14px}.dishgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.dish{border:1px solid #ddd0c2;border-radius:11px;padding:11px;background:#fff}.photo{height:170px;background:#eee5db;border-radius:8px;overflow:hidden;display:grid;place-items:center;color:#887e74;font-size:10px}.photo img{width:100%;height:100%;object-fit:cover}.dishhead{display:flex;justify-content:space-between;align-items:center;margin:9px 0}.dishhead b{font-size:11px}.badge{font-size:7px;font-weight:900;padding:5px 7px;border-radius:99px;background:#f0ece7;color:#766c63}.ready{background:#e6f8ee;color:#197348}.file{border:1px dashed #b9aea3;border-radius:7px;padding:8px;font-size:9px}.file input{width:100%;font-size:9px}.check{display:flex;align-items:center;gap:6px;font-size:9px;margin-top:10px}.check input{width:auto}.actions{display:flex;gap:7px;margin-top:9px}.save,.publish{flex:1;border:0;border-radius:8px;padding:9px;font-size:9px;font-weight:900;cursor:pointer}.save{background:#191512;color:#fff}.publish{background:var(--o);color:#111}.publish:disabled{opacity:.45;cursor:not-allowed}.model{height:170px;margin-top:9px;background:#20130c;border-radius:8px;overflow:hidden}.model model-viewer{width:100%;height:100%;--poster-color:transparent}.empty{padding:35px;text-align:center;background:#17110e;border:1px dashed #504239;border-radius:12px;color:#aaa;font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:#111;color:#fff;border:1px solid #4b423c;padding:11px 16px;border-radius:8px;font-size:10px;transition:.25s;z-index:50}.show{transform:translate(-50%,0)}
@media(max-width:850px){.dishgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.head,.rmain{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.dishgrid{grid-template-columns:1fr}.wrap{width:92vw}.admin{display:none}}
</style></head>
<body>
<header class="top"><div class="brand">PLATE<sup>3</sup><span class="admin">ADMIN</span></div><button id="signout" class="signout" style="display:none">Sign out</button></header>

<section id="login" class="login"><div class="card">
<div class="kicker">PLATE³ CONTROL CENTER</div><h1>Admin Login</h1><p>Manage restaurant submissions, 3D highlights, AR and publishing.</p>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" class="primary">Sign in to PLATE³</button><div id="err" class="error" style="display:none"></div>
</div></section>

<main id="app" class="wrap" style="display:none">
<div class="head"><div><div class="kicker">PLATE³ ADMIN</div><h1>Restaurant Submissions</h1><p>Review photos → upload GLB → enable AR → publish.</p></div><button id="refresh" class="refresh">↻ Refresh</button></div>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total submissions</span></div><div class="stat"><b id="processing">0</b><span>Processing</span></div><div class="stat"><b id="published">0</b><span>Published</span></div></div>
<div id="list"></div></main><div id="toast" class="toast"></div>

<script>
const URL='https://xsfpupefueccnhcvtdls.supabase.co';
const KEY='sb_publishable_ayAn7Nw7ROmU99h-HR_Ldw_TB8LIfFq';
const sb=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pub=(bucket,path)=>path?sb.storage.from(bucket).getPublicUrl(path).data.publicUrl:'';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2800)};
const date=v=>new Date(v).toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

async function session(){
 const {data:{session}}=await sb.auth.getSession();
 $('login').style.display=session?'none':'grid';$('app').style.display=session?'block':'none';$('signout').style.display=session?'block':'none';
 if(session) load();
}
async function login(){
 $('err').style.display='none';$('loginBtn').disabled=true;
 const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('loginBtn').disabled=false;if(error){$('err').textContent=error.message;$('err').style.display='block';return}session();
}
async function load(){
 $('list').innerHTML='<div class="empty">Loading submissions...</div>';
 const {data,error}=await sb.from('restaurant_submissions').select('*').order('created_at',{ascending:false});
 if(error){$('list').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
 $('total').textContent=data.length;$('processing').textContent=data.filter(x=>x.status!=='published').length;$('published').textContent=data.filter(x=>x.status==='published').length;
 $('list').innerHTML=data.length?data.map(r=>`<section class="restaurant"><div class="rmain"><div><h2>${esc(r.restaurant_name)}</h2><div class="meta">${esc(r.city)} · ${esc(r.phone)}<br>Submitted ${esc(date(r.created_at))}</div></div><div><span class="status ${r.status==='published'?'pub':''}">${esc(r.status||'processing')}</span> <button class="manage" onclick="openRestaurant('${r.id}')">Manage 3D</button></div></div><div id="d${r.id}" class="details" style="display:none"></div></section>`).join(''):'<div class="empty">No submissions yet.</div>';
}
async function openRestaurant(id){
 const box=$('d'+id);if(box.style.display==='block'){box.style.display='none';return}box.style.display='block';box.innerHTML='<div class="empty">Loading dish photos...</div>';
 const {data:r,error}=await sb.from('restaurant_submissions').select('*').eq('id',id).single();if(error){box.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
 const {data:models}=await sb.from('dish_models').select('*').eq('submission_id',r.submission_id).order('dish_number');
 const photos=Array.isArray(r.dish_photos)?r.dish_photos:[], count=Math.max(photos.length,models?.length||0);
 box.innerHTML='<h3>'+esc(r.restaurant_name)+' — 3D Highlights</h3><div class="dishgrid">'+Array.from({length:count},(_,i)=>dish(r,photos[i],models?.find(m=>m.dish_number===i+1),i+1)).join('')+'</div>';
}
function dish(r,path,m,n){
 const photo=pub('dish-photos',path), model=pub('3d-models',m?.model_3d_path),ready=!!m?.model_3d_path;
 return `<article class="dish" data-s="${esc(r.submission_id)}" data-n="${n}">
 <div class="photo">${photo?`<img src="${esc(photo)}" alt="Dish ${n}">`:'No photo'}</div>
 <div class="dishhead"><b>Dish ${n}</b><span class="badge ${ready?'ready':''}">${ready?'3D READY':'AWAITING GLB'}</span></div>
 <label>Dish name</label><input class="name" type="text" value="${esc(m?.dish_name||'')}" placeholder="e.g. Chicken Biryani">
 <label>Finished 3D model (.glb)</label><div class="file"><input class="glb" type="file" accept=".glb,model/gltf-binary"></div>
 ${model?`<div class="model"><model-viewer src="${esc(model)}" camera-controls auto-rotate ar alt="3D preview"></model-viewer></div>`:''}
 <label class="check"><input class="ar" type="checkbox" ${m?.ar_enabled?'checked':''}> Enable AR for customers</label>
 <div class="actions"><button class="save" onclick="saveDish(this)">Save</button><button class="publish" ${ready?'':'disabled'} onclick="publishDish(this)">${m?.published?'Published ✓':'Publish'}</button></div></article>`;
}
async function saveDish(btn){
 const c=btn.closest('.dish');btn.disabled=true;const s=c.dataset.s,n=+c.dataset.n,f=c.querySelector('.glb').files[0],name=c.querySelector('.name').value.trim(),ar=c.querySelector('.ar').checked;
 try{
  const q=await sb.from('dish_models').select('*').eq('submission_id',s).eq('dish_number',n).maybeSingle();if(q.error)throw q.error;let m=q.data,path=m?.model_3d_path||null;
  if(f){if(f.size>50*1024*1024)throw Error('GLB must be 50MB or smaller.');path=`${s}/dish-${n}-${Date.now()}.glb`;const u=await sb.storage.from('3d-models').upload(path,f,{upsert:false});if(u.error)throw Error('3D model upload failed: '+u.error.message)}
  if(!path)throw Error('Upload the finished GLB model first.');
  const payload={submission_id:s,dish_number:n,dish_name:name||null,model_3d_path:path,ar_enabled:ar,updated_at:new Date().toISOString()};
  const x=m?await sb.from('dish_models').update(payload).eq('id',m.id):await sb.from('dish_models').insert(payload);if(x.error)throw x.error;
  toast('Dish '+n+' saved.');await load(); 
 }catch(e){toast(e.message||'Could not save.')}btn.disabled=false;
}
async function publishDish(btn){
 const c=btn.closest('.dish');btn.disabled=true;try{
  const {data:m,error}=await sb.from('dish_models').select('*').eq('submission_id',c.dataset.s).eq('dish_number',+c.dataset.n).single();if(error)throw error;if(!m.model_3d_path)throw Error('Save a GLB first.');
  const x=await sb.from('dish_models').update({published:true,status:'published',updated_at:new Date().toISOString()}).eq('id',m.id);if(x.error)throw x.error;toast('Dish published.');load();
 }catch(e){toast(e.message||'Could not publish.');btn.disabled=false}
}
function showFatal(msg){$('err').textContent=msg;$('err').style.display='block'}
function init(){
 try{
  if(!window.supabase) throw Error('Supabase library did not load. Please refresh the page.');
  $('loginBtn').onclick=login;
  $('password').onkeydown=e=>{if(e.key==='Enter') login()};
  $('refresh').onclick=load;
  $('signout').onclick=async()=>{await sb.auth.signOut();session()};
  sb.auth.onAuthStateChange(()=>session());
  session();
 }catch(e){console.error(e);showFatal(e.message||'Admin panel failed to start.')}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script></body></html>
