<script>
const SUPABASE_URL='https://xsfpupefueccnhcvtdls.supabase.co';
const SUPABASE_KEY='sb_publishable_ayAn7Nw7ROmU99h-HR_Ldw_TB8LIfFq';
let sb=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pub=(bucket,path)=>{
  if(!path)return '';
  if(typeof path==='object') path=path.path||path.url||'';
  if(!path)return '';
  if(/^https?:\/\//i.test(String(path)))return String(path);
  return sb.storage.from(bucket).getPublicUrl(String(path)).data.publicUrl||'';
};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2800)};

async function onboardOwner(restaurantId){
  if(!sb)throw Error('Supabase is not ready.');
  const result=await withTimeout(
    sb.functions.invoke('onboard-owner',{
      body:{restaurant_submission_id:restaurantId}
    }),
    20000,
    'Owner onboarding request'
  );
  if(result.error){
    let message=result.error.message||'Owner onboarding failed.';
    try{
      if(result.error.context?.json){
        const body=await result.error.context.json();
        if(body?.error)message=body.error;
      }
    }catch(_){}
    throw Error(message);
  }
  return result.data||{};
}

const date=v=>new Date(v).toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const withTimeout=async(promise,ms,label)=>{
  let timer;
  try{
    return await Promise.race([
      promise,
      new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label+' timed out after '+Math.round(ms/1000)+' seconds.')),ms)})
    ]);
  }finally{clearTimeout(timer)}
};

async function session(){
 const {data:{session}}=await sb.auth.getSession();
 $('login').style.display=session?'none':'grid';$('app').style.display=session?'block':'none';$('signout').style.display=session?'block':'none';
 if(session) load();
}
async function login(){
 $('err').style.display='none';$('loginBtn').disabled=true;
 const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('loginBtn').disabled=false;if(error){$('err').textContent=error.message;$('err').style.display='block';return}session();
}
async function load(){
 $('list').innerHTML='<div class="empty">Loading submissions...</div>';
 const {data,error}=await sb.from('restaurant_submissions').select('*').order('created_at',{ascending:false});
 if(error){$('list').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
 $('total').textContent=data.length;$('processing').textContent=data.filter(x=>x.status!=='published').length;$('published').textContent=data.filter(x=>x.status==='published').length;
 $('list').innerHTML=data.length?data.map(r=>`<section class="restaurant"><div class="rmain"><div><h2>${esc(r.restaurant_name)}</h2><div class="meta">${esc(r.city)} · ${esc(r.phone)}<br>Submitted ${esc(date(r.created_at))}</div></div><div class="r-actions"><span class="status ${r.status==='published'?'pub':''}">${esc(r.status||'processing')}</span> <button class="manage" onclick="openRestaurant('${r.id}')">Manage 3D</button> ${r.status==='published'?`<button type="button" class="manage owner-btn" data-id="${esc(r.id)}" onclick="onboardOwnerFromButton(this)">Onboard Owner</button>`:''} <button type="button" class="delete-btn" data-id="${esc(r.id)}" data-name="${esc(encodeURIComponent(r.restaurant_name||'this restaurant'))}" onclick="deleteRestaurant(this.dataset.id,decodeURIComponent(this.dataset.name))">Delete</button></div></div><div id="d${r.id}" class="details" style="display:none"></div></section>`).join(''):'<div class="empty">No submissions yet.</div>';
}
async function onboardOwnerFromButton(btn){
  const id=btn?.dataset?.id;
  if(!id)return;
  const original=btn.textContent;
  btn.disabled=true;
  btn.textContent='Onboarding...';
  try{
    const result=await onboardOwner(id);
    const action=result.action||'completed';
    if(action==='invited'){
      toast('Owner invitation sent.');
    }else if(action==='linked_existing_user'){
      toast('Existing owner account linked.');
    }else if(action==='already_linked'){
      toast('Owner is already linked.');
    }else{
      toast('Owner onboarding: '+action);
    }
  }catch(e){
    console.error('Owner onboarding error:',e);
    toast('Owner onboarding failed: '+(e.message||'Unknown error'));
  }finally{
    btn.disabled=false;
    btn.textContent=original;
  }
}

async function openRestaurant(id){
 const box=$('d'+id);
 if(box.style.display==='block'){box.style.display='none';return}
 box.style.display='block';
 box.innerHTML='<div class="empty">Loading restaurant...</div>';

 try{
   const result=await withTimeout(
     sb.from('restaurant_submissions').select('*').eq('id',id).single(),
     15000,
     'Restaurant request'
   );
   const r=result.data,error=result.error;
   if(error)throw new Error('Could not load restaurant: '+error.message);
   if(!r)throw new Error('Restaurant record was not found.');

   const submissionId=r.submission_id||r.id;
   box.innerHTML='<div class="empty">Loading dish photos and 3D models...</div>';

   const modelsResult=await withTimeout(
     sb.from('dish_models').select('*').eq('submission_id',submissionId).order('dish_number'),
     15000,
     '3D models request'
   );
   if(modelsResult.error){
     throw new Error('Could not load 3D models: '+modelsResult.error.message);
   }

   const models=Array.isArray(modelsResult.data)?modelsResult.data:[];
   const photos=Array.isArray(r.dish_photos)?r.dish_photos:[];
   const count=Math.max(photos.length,models.length);

   if(!count){
     box.innerHTML='<h3>'+esc(r.restaurant_name)+' — 3D Highlights</h3><div class="empty">No dish photos were submitted for this restaurant.</div>';
     return;
   }

   box.innerHTML='<h3>'+esc(r.restaurant_name)+' — 3D Highlights</h3><div class="dishgrid">'+
     Array.from({length:count},(_,i)=>dish(r,photos[i],models.find(m=>m.dish_number===i+1),i+1)).join('')+
     '</div>';
 }catch(e){
   console.error('Manage 3D error:',e);
   box.innerHTML='<div class="empty" style="color:#ffb4a8;border-color:#8b4a3e">'+
     '<strong>Could not load Manage 3D.</strong><br><br>'+esc(e.message||'Unknown error')+
     '<br><br><button class="manage" onclick="openRestaurant(\''+esc(id)+'\')">Retry</button></div>';
 }
}
function photoSource(v){
 if(!v)return '';
 if(typeof v==='object')return v.path||v.url||v.name||'';
 return String(v);
}
function normalizeStoragePath(raw,bucket){
 if(!raw)return '';
 const s=String(raw);
 const fromUrl=storagePathFromUrl(s,bucket);
 if(fromUrl)return fromUrl;
 const prefix=bucket+'/';
 return s.startsWith(prefix)?s.slice(prefix.length):s;
}
function storagePathFromUrl(raw,bucket){
 try{
  const u=new URL(raw);
  const marker='/storage/v1/object/public/'+bucket+'/';
  const signedMarker='/storage/v1/object/sign/'+bucket+'/';
  let i=u.pathname.indexOf(marker);
  if(i>=0)return decodeURIComponent(u.pathname.slice(i+marker.length));
  i=u.pathname.indexOf(signedMarker);
  if(i>=0)return decodeURIComponent(u.pathname.slice(i+signedMarker.length));
 }catch(_){}
 return '';
}
async function downloadPhotoFromButton(btn){
 try{
  const source=JSON.parse(decodeURIComponent(btn.dataset.photo||'%22%22'));
  const fallbackUrl=decodeURIComponent(btn.dataset.photoUrl||'');
  const n=Number(btn.dataset.dish||1);
  btn.disabled=true;
  await downloadPhoto(source,n,fallbackUrl);
 }catch(e){
  console.error('Download button error:',e);
  toast('Unable to download photo. '+(e.message||''));
 }finally{btn.disabled=false}
}
async function downloadPhoto(source,n,fallbackUrl=''){
 const raw=photoSource(source);
 if(!raw && !fallbackUrl)throw Error('No dish photo available.');
 try{
  let blob;
  let path=normalizeStoragePath(raw,'dish-photos');

  // If the saved value is only a URL/name, try extracting the real
  // Supabase storage path from the image URL that is already displayed.
  if((!path || /^https?:\/\//i.test(path)) && fallbackUrl){
   path=normalizeStoragePath(fallbackUrl,'dish-photos');
  }

  if(path && !/^https?:\/\//i.test(path)){
   const result=await withTimeout(
    sb.storage.from('dish-photos').download(path),
    20000,
    'Photo download'
   );
   if(result.error)throw result.error;
   if(!result.data)throw Error('Photo file was empty.');
   blob=result.data;
  }else{
   if(!fallbackUrl)throw Error('Photo storage path was not found.');
   const res=await withTimeout(fetch(fallbackUrl,{mode:'cors',cache:'no-store'}),20000,'Photo download');
   if(!res.ok)throw Error('Could not download the photo ('+res.status+').');
   blob=await res.blob();
  }

  const type=blob.type||'image/jpeg';
  const ext=(type.split('/')[1]||'jpg').toLowerCase().replace('jpeg','jpg').replace(/[^a-z0-9]/g,'')||'jpg';
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='dish-'+n+'.'+ext;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast('Dish '+n+' image downloaded.');
 }
 catch(e){
  console.error('Photo download error:',e);
  throw e;
 }
}
function dish(r,path,m,n){
 const photo=pub('dish-photos',path), model=pub('3d-models',m?.model_3d_path),ready=!!m?.model_3d_path;
 return `<article class="dish" data-s="${esc(r.submission_id)}" data-n="${n}">
 <div class="photo">${photo?`<img src="${esc(photo)}" alt="Dish ${n}">`:'No photo'}</div>
 ${photo?`<div class="photo-tools"><button type="button" class="download-photo" data-photo="${esc(encodeURIComponent(JSON.stringify(path)))}" data-photo-url="${esc(encodeURIComponent(photo))}" data-dish="${n}" onclick="downloadPhotoFromButton(this)">⬇ Download Photo</button></div>`:''}
 <div class="dishhead"><b>Dish ${n}</b><span class="badge ${ready?'ready':''}">${ready?'3D READY':'AWAITING GLB'}</span></div>
 <label>Dish name</label><input class="name" type="text" value="${esc(m?.dish_name||'')}" placeholder="e.g. Chicken Biryani">
 <label>Finished 3D model (.glb)</label><div class="file"><input class="glb" type="file" accept=".glb,model/gltf-binary"></div>
 ${model?`<div class="model"><model-viewer src="${esc(model)}" camera-controls auto-rotate ar alt="3D preview"></model-viewer></div>`:''}
 <label class="check"><input class="ar" type="checkbox" ${m?.ar_enabled?'checked':''}> Enable AR for customers</label>
 <div class="actions"><button class="save" onclick="saveDish(this)">Save</button><button class="publish" ${ready?'':'disabled'} onclick="publishDish(this)">${m?.published?'Published ✓':'Publish'}</button></div></article>`;
}
async function saveDish(btn){
 const c=btn.closest('.dish');btn.disabled=true;const s=c.dataset.s,n=+c.dataset.n,f=c.querySelector('.glb').files[0],name=c.querySelector('.name').value.trim(),ar=c.querySelector('.ar').checked;
 try{
  const q=await withTimeout(sb.from('dish_models').select('*').eq('submission_id',s).eq('dish_number',n).maybeSingle(),15000,'Dish model lookup');
  if(q.error)throw q.error;let m=q.data,path=m?.model_3d_path||null;
  if(f){if(f.size>50*1024*1024)throw Error('GLB must be 50MB or smaller.');path=`${s}/dish-${n}-${Date.now()}.glb`;const u=await sb.storage.from('3d-models').upload(path,f,{upsert:false});if(u.error)throw Error('3D model upload failed: '+u.error.message)}
  if(!path)throw Error('Upload the finished GLB model first.');
  const payload={submission_id:s,dish_number:n,dish_name:name||null,model_3d_path:path,ar_enabled:ar,updated_at:new Date().toISOString()};
  const x=await withTimeout(
    m?sb.from('dish_models').update(payload).eq('id',m.id):sb.from('dish_models').insert(payload),
    15000,
    'Dish model save'
  );if(x.error)throw x.error;
  toast('Dish '+n+' saved.');await load(); 
 }catch(e){toast(e.message||'Could not save.')}btn.disabled=false;
}
async function publishDish(btn){
 const c=btn.closest('.dish');btn.disabled=true;try{
  const modelResult=await withTimeout(
    sb.from('dish_models').select('*').eq('submission_id',c.dataset.s).eq('dish_number',+c.dataset.n).single(),
    15000,
    'Dish model lookup'
  );
  const m=modelResult.data,error=modelResult.error;
  if(error)throw error;if(!m?.model_3d_path)throw Error('Save a GLB first.');

  const x=await withTimeout(
    sb.from('dish_models').update({published:true,status:'published',updated_at:new Date().toISOString()}).eq('id',m.id),
    15000,
    'Dish publish'
  );if(x.error)throw x.error;

  // Keep a public-facing copy on restaurant_submissions as well.
  // The public route can read this existing public table even when
  // dish_models is protected by RLS.
  const allModelsResult=await withTimeout(
    sb.from('dish_models')
      .select('dish_number,dish_name,model_3d_path,ar_enabled,published,status')
      .eq('submission_id',m.submission_id)
      .eq('published',true)
      .order('dish_number',{ascending:true}),
    15000,
    'Published model list'
  );
  if(allModelsResult.error)throw allModelsResult.error;

  const publicModels=(allModelsResult.data||[]).map(x=>({
    dish_number:x.dish_number,
    name:x.dish_name||('Signature Dish '+x.dish_number),
    dish_name:x.dish_name||null,
    path:x.model_3d_path,
    model_3d_path:x.model_3d_path,
    ar_enabled:!!x.ar_enabled,
    published:true,
    status:x.status||'published'
  }));

  const r=await withTimeout(
    sb.from('restaurant_submissions')
      .update({
        status:'published',
        three_d_models:publicModels,
        updated_at:new Date().toISOString()
      })
      .eq('submission_id',m.submission_id),
    15000,
    'Restaurant publish'
  );if(r.error)throw r.error;

   // Automatically onboard the restaurant owner after the restaurant is published.
   // If onboarding has an issue, publishing still succeeds and Admin can retry
   // from the "Onboard Owner" button on the restaurant card.
   try{
     const ownerLookup=await withTimeout(
       sb.from('restaurant_submissions')
         .select('id')
         .eq('submission_id',m.submission_id)
         .single(),
       15000,
       'Owner restaurant lookup'
     );
     if(ownerLookup.error)throw ownerLookup.error;
     const ownerResult=await onboardOwner(ownerLookup.data.id);
     if(ownerResult?.action==='invited'){
       toast('Dish published. Owner invitation sent.');
     }else if(ownerResult?.action==='linked_existing_user'){
       toast('Dish published. Existing owner account linked.');
     }else if(ownerResult?.action==='already_linked'){
       toast('Dish published. Owner already linked.');
     }else{
       toast('Dish published. Owner onboarding: '+(ownerResult?.action||'completed'));
     }
   }catch(ownerError){
     console.error('Owner onboarding after publish:',ownerError);
     toast('Dish published. Owner onboarding needs retry.');
   }

   load();
 }catch(e){toast(e.message||'Could not publish.');btn.disabled=false}
}
async function deleteRestaurant(id,name){
 const label=name||'this restaurant';
 if(!confirm('Delete "'+label+'"?\n\nThis will remove the restaurant submission, its 3D records, and uploaded dish photos/GLB files. This cannot be undone.'))return;

 const buttons=[...document.querySelectorAll('.delete-btn')].filter(b=>b.dataset.id===String(id));
 buttons.forEach(b=>b.disabled=true);

 try{
  // Load the restaurant first so we know its submission_id and storage files.
  const result=await withTimeout(
   sb.from('restaurant_submissions').select('*').eq('id',id).single(),
   15000,
   'Restaurant lookup'
  );
  if(result.error)throw result.error;
  const r=result.data;
  if(!r)throw Error('Restaurant record was not found.');

  const submissionId=r.submission_id||r.id;

  // Load related 3D records before deleting them.
  const modelsResult=await withTimeout(
   sb.from('dish_models').select('*').eq('submission_id',submissionId),
   15000,
   '3D records lookup'
  );
  if(modelsResult.error)throw modelsResult.error;
  const models=Array.isArray(modelsResult.data)?modelsResult.data:[];

  const photoPaths=(Array.isArray(r.dish_photos)?r.dish_photos:[])
   .map(photoSource).filter(Boolean)
   .map(p=>normalizeStoragePath(p,'dish-photos'))
   .filter(p=>p && !/^https?:\/\//i.test(p));

  const modelPaths=models.map(m=>m?.model_3d_path).filter(Boolean)
   .map(p=>normalizeStoragePath(p,'3d-models'))
   .filter(p=>p && !/^https?:\/\//i.test(p));

  // Delete child database rows first. Using .select() lets us verify
  // that Supabase actually deleted rows rather than returning 0 rows.
  if(models.length){
   const childDelete=await withTimeout(
    sb.from('dish_models').delete().eq('submission_id',submissionId).select('id'),
    15000,
    '3D records deletion'
   );
   if(childDelete.error){
    if(/row-level security|permission denied|policy/i.test(childDelete.error.message||'')){
     throw Error('Delete blocked by Supabase RLS on dish_models. Add a DELETE policy for your Admin user.');
    }
    throw childDelete.error;
   }
   if(!Array.isArray(childDelete.data) || childDelete.data.length!==models.length){
    throw Error('3D records were not fully deleted. Nothing else was removed.');
   }
  }

  // Delete the restaurant row and verify that exactly one row was removed.
  const restaurantDelete=await withTimeout(
   sb.from('restaurant_submissions').delete().eq('id',id).select('id'),
   15000,
   'Restaurant deletion'
  );
  if(restaurantDelete.error){
   if(/row-level security|permission denied|policy/i.test(restaurantDelete.error.message||'')){
    throw Error('Delete blocked by Supabase RLS on restaurant_submissions. Add a DELETE policy for your Admin user.');
   }
   throw restaurantDelete.error;
  }
  if(!Array.isArray(restaurantDelete.data) || restaurantDelete.data.length!==1){
   throw Error('Supabase deleted 0 restaurant rows. Check the DELETE RLS policy for your Admin user.');
  }

  // Database deletion succeeded. Storage cleanup is best-effort so a
  // Storage policy cannot make the restaurant reappear in the Admin list.
  const storageWarnings=[];

  if(photoPaths.length){
   const x=await withTimeout(
    sb.storage.from('dish-photos').remove([...new Set(photoPaths)]),
    15000,
    'Dish photo cleanup'
   );
   if(x.error)storageWarnings.push('dish photos: '+x.error.message);
  }

  if(modelPaths.length){
   const x=await withTimeout(
    sb.storage.from('3d-models').remove([...new Set(modelPaths)]),
    15000,
    '3D file cleanup'
   );
   if(x.error)storageWarnings.push('GLB files: '+x.error.message);
  }

  if(storageWarnings.length){
   toast('Restaurant deleted. Storage cleanup warning: '+storageWarnings.join(' | '));
  }else{
   toast('Restaurant deleted.');
  }

  await load();

 }catch(e){
  console.error('Delete restaurant error:',e);
  toast('Could not delete: '+(e.message||'Unknown error'));
  buttons.forEach(b=>b.disabled=false);
 }
}
function showFatal(msg){$('err').textContent=msg;$('err').style.display='block'}
function init(){
 try{
  if(!window.supabase || typeof window.supabase.createClient!=='function'){
   throw Error('Supabase library did not load. Please refresh the page.');
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  $('loginBtn').onclick=login;
  $('password').onkeydown=e=>{if(e.key==='Enter') login()};
  $('refresh').onclick=load;
  $('signout').onclick=async()=>{if(sb){await sb.auth.signOut();session()}};
  sb.auth.onAuthStateChange(()=>session());
  session();
 }catch(e){console.error(e);showFatal(e.message||'Admin panel failed to start.')}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script></body></html>
