<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eadc;color:#111827;font-family:Inter,Arial,sans-serif}.top{height:72px;background:#090909;display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#aaa}.top img{height:44px}.top span{font-size:10px;letter-spacing:1.5px}.wrap{max-width:1120px;margin:auto;padding:28px 20px 50px}.card{overflow:hidden;border-radius:22px;background:#fffaf3;border:1px solid #dfd3c4;box-shadow:0 20px 60px rgba(45,30,18,.12)}.head{padding:28px 32px;background:linear-gradient(120deg,#fffaf3,#ecdfd0);display:flex;justify-content:space-between;gap:20px}.kicker{font-size:8px;letter-spacing:2.5px;color:#ff6800;font-weight:900}.head h1{margin:7px 0;font-size:36px}.address{font-size:11px;color:#687181;line-height:1.6}.badge{background:#111;color:#fff;border-radius:20px;padding:8px 12px;height:max-content;font-size:8px;white-space:nowrap}.badge i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#32b66a;margin-right:5px}.hero3d{padding:28px 32px;background:linear-gradient(145deg,#090807,#301206);color:#fff}.hero3d h2{font-size:19px;margin:0 0 13px}.modelbox{height:330px;border:1px solid #65493a;border-radius:16px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 42%,rgba(255,104,0,.34),transparent 26%),#0b0807}.modelbox model-viewer{width:100%;height:100%}.pending{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.pending-inner{max-width:440px;padding:20px}.pending .icon{width:58px;height:58px;border:1px solid #ff6800;border-radius:50%;display:grid;place-items:center;margin:auto;color:#ff6800;font-size:24px}.pending h3{font-size:21px;margin:12px 0 7px}.pending p{font-size:10px;line-height:1.6;color:#c8c1ba}.pending strong{color:#ff9a3d}.menus{padding:28px 32px}.menus h2{font-size:20px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.menu-img{width:100%;border-radius:11px;border:1px solid #ded4c8;background:#eee}footer{background:#090909;color:#aaa;text-align:center;padding:20px;font-size:8px}footer b{color:#fff}.error{text-align:center;padding:90px 20px}.error h1{font-size:32px}.error p{color:#687181}@media(max-width:700px){.top{height:60px;padding:0 16px}.top img{height:37px}.wrap{padding:14px 9px 30px}.head{padding:22px 18px;display:block}.head h1{font-size:28px}.badge{display:inline-block;margin-top:10px}.hero3d{padding:22px 13px}.modelbox{height:300px}.menus{padding:22px 13px}.grid{grid-template-columns:1fr 1fr;gap:8px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header class="top"><a href="/"><img src="logo.png" alt="PLATE³"></a><span>DIGITAL MENU</span></header>
<main class="wrap"><div id="app" class="card"><div class="error">Loading menu…</div></div></main><footer>Powered by <b>PLATE³</b> · See Before You Order.</footer>
<script>
const SUPABASE_URL='https://xsfpupefueccnhcytdls.supabase.co',SUPABASE_ANON_KEY='sb_publishable_ayAn7Nw7ROmU99h-HR_Ldw_TB8LIfFq';
const sb=(SUPABASE_URL.startsWith('https://')&&!SUPABASE_ANON_KEY.includes('PASTE_'))?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const slug=(location.pathname.split('/').filter(Boolean).pop()||'').toLowerCase(),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 if(!sb){app.innerHTML='<div class="error"><h1>Backend not connected</h1><p>Add the Supabase URL and anon key to this file.</p></div>';return}
 const {data:r,error}=await sb.from('restaurants').select('*').eq('slug',slug).maybeSingle();
 if(error||!r){app.innerHTML='<div class="error"><h1>Menu not found</h1><p>This restaurant menu could not be found.</p></div>';return}
 const menus=Array.isArray(r.menu_files)?r.menu_files:[],models=Array.isArray(r.model_urls)?r.model_urls:[],model=models.find(Boolean);
 const stage=model?`<model-viewer src="${esc(model)}" camera-controls auto-rotate shadow-intensity="1"></model-viewer>`:`<div class="pending"><div class="pending-inner"><div class="icon">◇</div><h3>Your 3D experience is being prepared.</h3><p>PLATE³ is creating your selected 3D dish highlights. <strong>They will be added within 48 hours.</strong></p></div></div>`;
 app.innerHTML=`<section class="head"><div><div class="kicker">PLATE³ DIGITAL MENU</div><h1>${esc(r.restaurant_name)}</h1><div class="address">${esc(r.address)} · ${esc(r.city)} ${esc(r.zip_code)}<br>${esc(r.phone)}</div></div><div class="badge"><i></i>${model?'3D READY':'3D IN PROGRESS'}</div></section><section class="hero3d"><h2>Signature 3D Experience</h2><div class="modelbox">${stage}</div></section><section class="menus"><h2>Our Menu</h2><div class="grid">${menus.map((u,i)=>`<a href="${esc(u)}" target="_blank"><img class="menu-img" src="${esc(u)}" alt="Menu page ${i+1}" loading="lazy"></a>`).join('')}</div></section>`;
}load();
</script></body></html>
